spring.application.name=passro-backend

# Import .env file
spring.config.import=optional:file:.env[.properties]

# Database Settings
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis Settings
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Settings
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.cupid.qufit=DEBUG

# SMTP Settings
# SMTP Mail Host
spring.mail.host=smtp.gmail.com
# SMTP Mail Port
spring.mail.port=587
# SMTP Mail Username
spring.mail.username=${SMTP_USER_NAME}
# SMTP Mail Password
spring.mail.password=${SMTP_PASSWORD}
# SMTP Mail Authentication
spring.mail.properties.mail.smtp.auth=true
# STARTTLS Enable
spring.mail.properties.mail.smtp.starttls.enable=true


# JWT Settings
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=1209600000

# Server Settings
server.port=8080

# Timezone Setting
spring.jackson.time-zone=Asia/Seoul

# S3 Settings
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_REGION:ap-northeast-2}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.path-style-access-enabled=${AWS_S3_PATH_STYLE:true}

# Subway API Settings
public-data.subway.service-key=${SUBWAY_API_KEY}
public-data.subway.base-url=https://apis.data.go.kr/1613000/SubwayInfo/GetKwrdFndSubwaySttnList

# Delivery Point Tariff
delivery.point.base=${DELIVERY_POINT_BASE:2000}
delivery.point.in-route-station-limit=${DELIVERY_POINT_IN_ROUTE_STATION_LIMIT:10}
delivery.point.in-route-over-limit=${DELIVERY_POINT_IN_ROUTE_OVER_LIMIT:200}
delivery.point.size.S=${DELIVERY_POINT_SIZE_S:0}
delivery.point.size.M=${DELIVERY_POINT_SIZE_M:500}
delivery.point.size.L=${DELIVERY_POINT_SIZE_L:1000}

