# The JDBC connection is supplied automatically by Testcontainers @ServiceConnection
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Dummy values required to create the Spring application context
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

spring.mail.username=test@example.com
spring.mail.password=test-password

jwt.secret=test-secret-key-for-passro-test-environment-only

public-data.subway.service-key=test-service-key

aws.s3.bucket=test-bucket
aws.s3.region=ap-northeast-2
aws.s3.access-key=test-access-key
aws.s3.secret-key=test-secret-key
